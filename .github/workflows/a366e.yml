name: A366E Build Process

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      clang_version:
        required: true
        type: string

      branch:
        required: true
        type: string
      version:
        required: true
        type: string

      ksu-next:
        required: true
        type: string
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      zeromount:
        required: true
        type: string
      unicode_fix:
        required: true
        type: string
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      kernel_optimizations:
        required: true
        type: string

jobs:
  build-a366e-gki:
    name: "${{ inputs.version }}-${{ inputs.branch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: thejerrybao/setup-swap-space@v1   # or pierotofy/set-swap-space
        with:
          swap-size-gb: 25          # 10-24 GB is common for heavy LTO
        # swap-space-path: /mnt/swapfile   # optional

      - name: Setup dependencies
        uses: ./.github/actions/dependencies
        with:
          clang_version: ${{ inputs.clang_version }}
          branch: ${{ inputs.branch }}
          zeromount: ${{ inputs.zeromount }}
          susfs: ${{ inputs.susfs }}

      - name: Clone kernel
        uses: ./.github/actions/clone_kernel
        with:
          kernel_branch: ${{ inputs.kernel_branch }}

      - name: Setup environment variables
        uses: ./.github/actions/env
        with:
          susfs: ${{ inputs.susfs }}
          zeromount: ${{ inputs.zeromount }}

      - name: Add KernelSU-Next
        if: inputs.ksu-next == 'true'
        uses: ./.github/actions/ksu-next

      - name: Build
        uses: ./.github/actions/build
