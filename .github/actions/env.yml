name: Setup environment variables
description: Setup environment variables

inputs:
  susfs:
    description: 'SUSFS'
    required: true
  zeromount:
    description: 'Zeromount'
    required: true

runs:
  using: composite

steps:
  - name: Set directory variables
    shell: bash
    run: |
      ROOT="$GITHUB_WORKSPACE"
      echo "CLANG=$ROOT/clang" >> $GITHUB_ENV
      if [[ ${{ inputs.susfs }} == 'true' ]]; then
        echo "SUSFS4KSU=$ROOT/susfs4ksu" >> $GITHUB_ENV
        echo "KERNEL_PATCHES=$ROOT/kernel_patches" >> $GITHUB_ENV
      fi
      if [[ ${{ inputs.zeromount }} == 'true' ]]; then
        echo "ZEROMOUNT=$ROOT/Super-Builders" >> $GITHUB_ENV
      fi
      echo "COMMON=$ROOT/common" >> $GITHUB_ENV
      echo "GKI_DEFCONFIG=$ROOT/common/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
      echo "ROOT=$ROOT" >> $GITHUB_ENV
